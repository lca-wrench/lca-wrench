# Lint and tests, as ./check.sh runs them locally, on Linux, Windows and macOS. The tests need the free BAFU 2025
# project (setup_daten.py, 62 MB from files.brightway.dev); the Brightway folder is cached per system so it is
# downloaded once per change of setup_daten.py.
name: check
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false  # a failure on one system still shows the result of the others
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash  # the same commands everywhere (Git Bash on Windows)
    env:
      BRIGHTWAY2_DIR: ${{ github.workspace }}/.brightway
      PYTHON: python
      PYTHONUTF8: "1"  # Windows: UTF-8 for files and subprocess output, as the release package sets it
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      # two steps: the lock file installs with checksums (--require-hashes), the dev tools without
      - run: pip install -r requirements-lock.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m ruff check .
      - uses: actions/cache@v4
        with:
          path: .brightway
          key: brightway-${{ runner.os }}-${{ hashFiles('setup_daten.py', 'requirements-lock.txt') }}
      - run: mkdir -p .brightway && python setup_daten.py
      - run: python -m playwright install --with-deps chrome
      - run: python -m pytest -q
